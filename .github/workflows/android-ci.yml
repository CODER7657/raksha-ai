name: Android CI

# The android/ module shipped in #20 with no CI at all - both existing workflows
# filter on backend/** and frontend/**, so 878 lines went in without anything
# compiling them. That is tolerable for a shell that does not run in production.
# It stops being tolerable when the on-device rule engine lands there, because
# that is the detection path running on someone's phone with no network.
#
# COST. This repository is private, so Actions is capped at 2,000 free minutes a
# month (see keep-alive.yml for the same arithmetic). An Android build is the
# most expensive job here - roughly 3-5 minutes cold, ~2 warm with the cache -
# against ~30s for the other two. Two things keep that affordable: the path
# filter below, so it only runs when android/ actually changes, and the
# concurrency group, so pushing three times to a PR bills one build rather than
# three.

on:
  # Manual trigger. Four workflows here already had one — android-release,
  # keep-alive, provider-smoke and frontend-deploy — and the three that gate
  # correctness did not, which is the wrong way round.
  #
  # The prompt for adding it was a mistake worth recording rather than the
  # reason it stays. On b836909 I queried the API for that commit's runs, found
  # only a manually-dispatched one, and concluded Backend CI had failed to
  # fire. It had not: the run was created at 17:08:37Z, roughly two minutes
  # after I looked. I drew a firm conclusion from an absence without first
  # establishing that the absence was stable, which is the same error this
  # repository keeps finding in its own guards — silence read as a result.
  #
  # A dispatch trigger is still worth having on a correctness gate: when a check
  # genuinely does not run (#22, #34, #125) the recovery should not be an empty
  # commit. But it is here on that argument, not on an incident that did not
  # happen.
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      # :core:rules is tested against the shared corpus, which lives outside
      # android/. Editing only the corpus must run the Kotlin half of the parity
      # contract, or a corpus change could be enforced on the server and
      # silently unchecked on the device.
      - 'testdata/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'testdata/**'

# A newer push to the same branch makes the running build irrelevant. Without
# this, an active PR bills every intermediate commit.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The wrapper JAR is a binary that executes on every developer machine and
      # every run of this workflow, and `.gitattributes` marks *.jar binary - so
      # a swapped JAR shows up in review as nothing at all. This checks it
      # against Gradle's published checksums.
      #
      # The JAR committed in #20 was verified by hand (SHA-256 7a9ce74c..., the
      # published Gradle 9.7.0 wrapper checksum). This step is what stops that
      # from being a one-time favour nobody repeats at the next version bump.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Handles the Gradle distribution and dependency cache. Writes the cache
      # only from master, so a PR cannot poison what other branches read.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No `|| true` anywhere in this file. The backend job had `pytest -q ||
      # echo "No tests yet"`, which reported green while 47 tests failed to
      # collect at all (see #22). A check that cannot fail is worse than no
      # check, because people believe it.
      #
      # compileSdk is 37, which the runner may not have preinstalled. The image
      # ships cmdline-tools with licences pre-accepted, so AGP fetches the
      # missing platform itself; that download is the bulk of a cold run.
      # Runs before the APK build, and in the same job so it costs no extra
      # Actions minutes. :core:rules is a plain JVM module with no Android
      # dependencies, so this is seconds and needs no SDK - and `assembleDebug`
      # alone would never execute a unit test, leaving the device half of the
      # parity contract unchecked.
      - name: Rule engine parity against the shared corpus
        working-directory: android
        run: ./gradlew :core:rules:test --stacktrace

      # The sentence directly above - "assembleDebug alone would never execute
      # a unit test" - is true of :app as well, and this workflow stopped at
      # :core:rules. So every unit test in the app module has been dormant
      # since it was written: RuleLabelCoverageTest, SafeLogContractTest,
      # SmsAssemblyTest, and the shadowing guard added by #71, whose whole
      # subject is the one failure the string generator cannot see by
      # construction.
      #
      # Nothing was wrong with those tests. Nothing ever ran them. That is the
      # #22 lesson in its quietest form: not a check that passes when it should
      # fail, but a check nobody notices is not being asked.
      #
      # testDebugUnitTest, not `test`, deliberately: `test` runs debug AND
      # release variants and would roughly double the cost for a second run of
      # identical assertions. The debug variant compiles the same sources and
      # triggers the same string generator, so it proves the same thing.
      #
      # Placed before assembleDebug so a failing assertion is the first thing
      # reported rather than something found after an APK has been built.
      - name: App unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # The debug build does not run R8, so it cannot tell us whether shrinking
      # broke anything — and R8 breaks things by *removing* code, which produces
      # a build that installs and then fails at runtime on the one path nobody
      # exercised. For this app that path is the SMS receiver, reached by name
      # from the manifest and referenced from nowhere in the bytecode.
      #
      # Unsigned, because there is no keystore in CI and signing is a release
      # concern rather than a correctness one. What this proves is that the
      # minified APK assembles at all.
      - name: Build release APK (R8 enabled)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      # Same reasoning as the rule report below, and more load-bearing here:
      # Gradle's daemon cannot start in some sandboxed local environments, so
      # for anyone in that position CI is the only place these tests ever run.
      # A bare "task failed" with no report would leave them with nothing.
      - name: Upload app test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload rule test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-rule-test-report
          path: android/core/rules/build/reports/tests/test/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: raksha-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
