name: Backend CI

on:
  # Manual trigger, because a push that should have run this once did not.
  # b836909 changed backend/app/services/llm.py — squarely inside the paths
  # filter below — and no Backend CI run was ever created for that SHA. The
  # cause is not visible from here; the consequence was, and it is that a check
  # which fails to fire has no way of being asked to fire.
  #
  # This repository has been bitten three times by a check that did not run
  # (#22, #34, #125) and each time the symptom was silence. A dispatch trigger
  # does not stop that happening; it makes it recoverable in one click instead
  # of needing an empty commit to provoke.
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      # The rule corpus is the specification the Python engine is tested
      # against, and it lives outside backend/. Without this line, editing only
      # the corpus runs no Python check at all - the half of the parity contract
      # that this job owns would silently not run on exactly the change most
      # likely to break it.
      - 'testdata/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'testdata/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt includes requirements.txt and pins the test
          # tooling, so CI runs the pytest version the repo asks for rather than
          # whatever is newest that morning.
          pip install -r requirements-dev.txt
          pip install ruff

      # Both steps below used to end in `|| true` and `|| echo "No tests yet"`.
      # That made the check unfailable: #18 shipped 47 tests that could not even
      # be collected on a clean runner, and this job still reported green. See
      # #22. Two rules are ignored in backend/ruff.toml, each with its reason.
      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q
