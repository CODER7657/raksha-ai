name: Backend CI

on:
  # Manual trigger. Four workflows here already had one — android-release,
  # keep-alive, provider-smoke and frontend-deploy — and the three that gate
  # correctness did not, which is the wrong way round.
  #
  # The prompt for adding it was a mistake worth recording rather than the
  # reason it stays. On b836909 I queried the API for that commit's runs, found
  # only a manually-dispatched one, and concluded Backend CI had failed to
  # fire. It had not: the run was created at 17:08:37Z, roughly two minutes
  # after I looked. I drew a firm conclusion from an absence without first
  # establishing that the absence was stable, which is the same error this
  # repository keeps finding in its own guards — silence read as a result.
  #
  # A dispatch trigger is still worth having on a correctness gate: when a check
  # genuinely does not run (#22, #34, #125) the recovery should not be an empty
  # commit. But it is here on that argument, not on an incident that did not
  # happen.
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      # The rule corpus is the specification the Python engine is tested
      # against, and it lives outside backend/. Without this line, editing only
      # the corpus runs no Python check at all - the half of the parity contract
      # that this job owns would silently not run on exactly the change most
      # likely to break it.
      - 'testdata/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'testdata/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt includes requirements.txt and pins the test
          # tooling, so CI runs the pytest version the repo asks for rather than
          # whatever is newest that morning.
          pip install -r requirements-dev.txt
          pip install ruff

      # Both steps below used to end in `|| true` and `|| echo "No tests yet"`.
      # That made the check unfailable: #18 shipped 47 tests that could not even
      # be collected on a clean runner, and this job still reported green. See
      # #22. Two rules are ignored in backend/ruff.toml, each with its reason.
      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q
