name: Frontend CI

on:
  # Manual trigger. Four workflows here already had one — android-release,
  # keep-alive, provider-smoke and frontend-deploy — and the three that gate
  # correctness did not, which is the wrong way round.
  #
  # The prompt for adding it was a mistake worth recording rather than the
  # reason it stays. On b836909 I queried the API for that commit's runs, found
  # only a manually-dispatched one, and concluded Backend CI had failed to
  # fire. It had not: the run was created at 17:08:37Z, roughly two minutes
  # after I looked. I drew a firm conclusion from an absence without first
  # establishing that the absence was stable, which is the same error this
  # repository keeps finding in its own guards — silence read as a result.
  #
  # A dispatch trigger is still worth having on a correctness gate: when a check
  # genuinely does not run (#22, #34, #125) the recovery should not be an empty
  # commit. But it is here on that argument, not on an incident that did not
  # happen.
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Unit tests
        run: npm test

      # vite.config.ts now refuses to build without a valid API base URL and
      # Supabase config (scripts/check-build-env.mjs), so CI has to supply
      # some. This bundle is never deployed, so the values only need to be
      # well formed: the public backend origin and an obviously fake project.
      - name: Build
        env:
          VITE_API_BASE_URL: https://raksha-ai-api.vercel.app
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

      # The guard is only worth having if it actually stops a build. This is
      # the exact value that shipped to production.
      - name: Build refuses a placeholder API URL
        env:
          VITE_API_BASE_URL: '[SENSITIVE]'
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: |
          if npx vite build --logLevel error > "$RUNNER_TEMP/bad-build.log" 2>&1; then
            echo "::error::vite build accepted VITE_API_BASE_URL=[SENSITIVE]"
            exit 1
          fi
          grep -q 'VITE_API_BASE_URL is not an absolute URL' "$RUNNER_TEMP/bad-build.log"
