name: Keep backend awake

# Render's free tier sleeps after ~15 minutes idle, and the cold start costs
# ~40-50s. A ping keeps it warm.
#
# WHY THIS IS NOT ON A 5-MINUTE SCHEDULE ANY MORE:
# This repository is private, so GitHub Actions is capped at 2,000 free minutes
# a month. Every scheduled run bills a full minute even though the ping takes
# ~2 seconds, so a */5 schedule costs ~8,640 minutes/month - four times the
# entire quota, and it would silently stop partway through the month.
#
# A schedule that fits the quota (every ~30 min) is useless here, because Render
# sleeps at 15. So scheduling is off, and warming is delegated to an external
# uptime pinger - see docs in README. UptimeRobot's free tier does 5-minute
# checks indefinitely at no cost and no Actions minutes.
#
# workflow_dispatch is kept so anyone can warm the backend on demand from the
# Actions tab before a demo.

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://raksha-ai-c5yu.onrender.com/health || echo 000)
          echo "health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Backend health check returned $code"
          fi
