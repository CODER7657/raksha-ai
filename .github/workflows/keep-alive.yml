name: Backend health check

# Manual check that the deployed backend answers. It used to keep a Render
# instance awake; the backend is now a Vercel function (backend-deploy.yml),
# which does not sleep, so nothing needs pinging on a schedule. No schedule on
# purpose: this repository is private and every run bills a full Actions minute
# (tests/test_workflows.py keeps it that way).

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://raksha-ai-api.vercel.app/health || echo 000)
          echo "health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Backend health check returned $code"
          fi
