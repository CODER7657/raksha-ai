name: Refresh threat feeds

# The known-bad hash lists are files in the repository, and nothing was
# rebuilding them. `threat_feeds.py` shipped with the loader, the
# canonicalisation, the signal shape and its tests; `refresh_threat_feeds.py`
# shipped with the fetchers. Neither had a caller, so all four lists have been
# empty since they were created.
#
# An empty list is not a broken feature in any way a user can see. `lookup()`
# returning `[]` reads as "no feed listed this URL", so a stage-1 link check has
# been issuing a clean bill of health on the feed basis to every URL that has
# ever been scanned. That is the shape of failure this repository keeps finding:
# silent, and identical to a quiet day.
#
# COST. Two HTTP GETs and about a minute of runner time, daily — roughly 30
# minutes a month against the 2,000 a private repo gets. URLhaus refreshes every
# five minutes and OpenPhish every twelve hours, so daily is behind both feeds
# and ahead of the pace a phishing URL stays live. Hourly would spend eight
# times the minutes to shorten a window that is already shorter than the
# review-and-deploy cycle.
#
# SECRETS. URLHAUS_AUTH_KEY, optional. abuse.ch retired keyless downloads on
# 2026-10-21 (the old csv_online URL answers 410 Gone); the free Auth-Key from
# auth.abuse.ch goes in the export URL's path, and the script redacts it from
# every error it prints. Safe Browsing and PhishTank need keys too. Any feed
# without its key is skipped by name, and a skipped feed leaves its existing
# file untouched. OpenPhish needs nothing, so a run with no secrets still
# refreshes one list rather than failing outright.
#
# WHY THIS COMMITS. The lists are committed data, not build output: the scan
# path reads them from disk on a Render instance that is deployed from the
# repository. A refresh that did not commit would rebuild the lists inside a
# runner and throw them away.
#
# WHY IT OPENS A PR INSTEAD OF PUSHING TO MASTER. It used to `git push` to
# master, and master requires a reviewed PR, so every run since protection was
# turned on died with GH006 after doing all the work — 35 red runs in a row.
# Now each run rebuilds one rolling branch (BOT_BRANCH) from master, force-
# pushes it, and opens a PR or updates the open one. A day nobody merges costs
# nothing: tomorrow's run replaces the branch rather than stacking a second PR.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". Without it the push still lands and the step fails
# naming that setting.
#
# WHAT THAT COSTS, measured on the first real run rather than guessed. URLhaus
# returned 16,097 digests and OpenPhish 300 — 1,037 KB and 19 KB. URLhaus
# refreshes every five minutes, so most of that file changes daily and the
# commit is close to a full rewrite: roughly 1 MB of git history per day, or
# ~365 MB a year, for a private repository.
#
# That is survivable and it is not free, and nobody had costed it before this
# workflow existed. If it becomes a problem the options are a shorter retention
# window on the URLhaus list, fetching at deploy time instead of committing, or
# storing hash prefixes rather than full digests. Recorded here so the decision
# is made with the number in front of it.

on:
  schedule:
    # 03:30 UTC — 09:00 IST, so an overnight refresh is already in place before
    # anyone is demoing, and a failure is visible at the start of the day.
    - cron: '30 3 * * *'
  workflow_dispatch:

# One refresh at a time. Two overlapping runs would race on the same four files
# and could commit a half-updated set.
concurrency:
  group: refresh-threat-feeds
  cancel-in-progress: false

# contents: write pushes the bot branch; pull-requests: write opens the PR.
# Neither can touch master: it is protected and needs a reviewed PR.
permissions:
  contents: write
  pull-requests: write

env:
  BOT_BRANCH: bot/threat-feeds

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Deliberately NOT passing --allow-empty. A feed that answers 200 with an
      # empty body, or with a format the parser no longer understands, must not
      # replace a working list with nothing — the script refuses and reports the
      # feed as skipped. Emptying a list is a decision a person makes after
      # checking, not something a nightly job does on a bad morning.
      #
      # The script already prints a per-feed count, so its own output becomes the
      # commit body rather than being recomputed here. One source for the number.
      - name: Rebuild the hash lists
        working-directory: backend
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: python scripts/refresh_threat_feeds.py | tee "$RUNNER_TEMP/refresh.log"

      # `git diff --quiet` exits non-zero when there is something to commit, so
      # the PR is touched only on a real change. A daily no-op would bury the
      # days something actually moved.
      - name: Open or update the feed refresh PR
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/feeds/; then
            echo "No feed changed. Nothing to propose."
            exit 0
          fi

          {
            echo "Refresh threat feed hash lists"
            echo
            cat "$RUNNER_TEMP/refresh.log"
            echo
            echo "Rebuilt by .github/workflows/refresh-threat-feeds.yml."
            echo "Digests only, never URLs - see backend/data/feeds/README.md."
          } > "$RUNNER_TEMP/commit-message.txt"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BOT_BRANCH"
          git add data/feeds/
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          # The branch belongs to this workflow alone and is rebuilt from
          # master every run, so overwriting it is the intent.
          git push --force origin "HEAD:refs/heads/$BOT_BRANCH"

          existing=$(gh pr list --head "$BOT_BRANCH" --base master --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Updated open PR #$existing."
            exit 0
          fi

          if ! gh pr create --base master --head "$BOT_BRANCH"                 --title "Refresh threat feed hash lists"                 --body-file "$RUNNER_TEMP/commit-message.txt"; then
            echo "::error::Pushed $BOT_BRANCH but could not open a PR. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/master...$BOT_BRANCH"
            exit 1
          fi
