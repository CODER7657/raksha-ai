# Version catalogue. Every version lives here, not scattered across build files.
#
# All of these were read from the registries (Google Maven / Maven Central /
# services.gradle.org) rather than copied from another project, so they are
# current as of the day this module was scaffolded.
#
# On AGP: 9.x is required, not optional. The current AndroidX libraries
# (core 1.19.0, Compose 1.12.0) refuse to build under AGP 8.x and demand
# compileSdk 37 — an 8.13.2 build fails with 26 errors saying exactly that.
# AGP 9 also requires Gradle 9, so agp/gradle/compileSdk move together.

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
# Test-only. Used by :core:rules to read the shared corpus; the production
# source set of that module has no dependencies at all, deliberately.
kotlinxSerializationJson = "1.11.0"
junit4 = "4.13.2"
# ViewModel + navigation for the multi-screen app (#116 §3). Both stable
# releases; the newest tags on these artifacts are alpha/rc and a security
# app has no reason to be on either.
lifecycle = "2.11.0"
navigationCompose = "2.9.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# The BOM pins every Compose artifact below it, so their versions are omitted.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The small icon set, not material-icons-extended: three navigation icons and
# a back arrow do not justify shipping the whole catalogue to a cheap handset.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# Android unit tests run on JUnit4 by default. kotlin-test-junit maps
# kotlin.test.* onto it, so the app and :core:rules tests read the same way
# even though the two modules use different runners underneath.
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Plain JVM Kotlin, for :core:rules. This is the standalone Kotlin plugin and
# does not conflict with AGP 9's built-in Kotlin — that conflict applies only
# to `kotlin-android` on an Android module.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Since Kotlin 2.0 the Compose compiler ships with Kotlin itself, so this
# tracks the Kotlin version rather than having one of its own.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
